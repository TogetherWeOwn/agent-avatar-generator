name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Clean locked install (dependency wheels only)
        run: uv sync --locked --all-extras --no-build
      - name: Build first-party wheel (reviewed declarative setuptools backend)
        run: uv build --wheel --no-sources
      - name: Tests (offline, no API calls)
        run: uv run --no-sync pytest -v
        env:
          OPENAI_API_KEY: ""
      - name: Manifest check
        run: uv run --no-sync agent-avatar manifest
      - name: Dry run
        run: uv run --no-sync agent-avatar generate --preset qa-reviewer --dry-run
